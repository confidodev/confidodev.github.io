<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confido</title>
<meta name="description" content="Saját tartalmak és projektek.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap&subset=latin-ext">
<style>
:root{--bg:#f3f5f2;--surface:#fff;--fg:#1a2330;--muted:#5a6573;--line:#d8ddd5;--blue:#1d5aa6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161c;--surface:#181f27;--fg:#e4e9ee;--muted:#98a3b0;--line:#2b333d;--blue:#6aa3ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161c;--surface:#181f27;--fg:#e4e9ee;--muted:#98a3b0;--line:#2b333d;--blue:#6aa3ea;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Barlow",system-ui,-apple-system,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:56px 16px}
h1{font:700 clamp(36px,7vw,56px)/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 8px;letter-spacing:.01em}
.lead{color:var(--muted);margin:0 0 40px}
.cards{display:grid;gap:12px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--blue)}
a.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card h2{font:600 22px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 4px}
.card p{margin:0;color:var(--muted);font-size:15px}
footer{margin-top:48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Confido</h1>
  <p class="lead">Saját tartalmak, amiket az ismerősökkel osztok meg. Hamarosan szakmai oldal is.</p>
  <div class="cards">
    <a class="card" href="kektura/">
      <h2>Kéktúra közös napló</h2>
      <p>Hol tartunk az Országos Kéktúrán: szakaszonként, térképen, Dénes és Nóri pecsétjei alapján.</p>
    </a>
  </div>
  <footer>confidodev.github.io</footer>
</div>
</body>
</html>
